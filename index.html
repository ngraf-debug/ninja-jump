<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Ninja Jump 4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button,.btn,canvas{-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important;touch-action:none!important}html,body{margin:0;height:100%;overflow:hidden;background:#07111d;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;z-index:4;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:900;text-shadow:0 2px 5px #000;font-size:15px}
.btn{position:fixed;z-index:8;bottom:max(18px,env(safe-area-inset-bottom));border:2px solid #ffffff99;border-radius:50%;background:#111827dd;color:white;font-weight:900;touch-action:none}
#L,#R{width:78px;height:78px;font-size:30px}#L{left:14px}#R{left:102px}#J{right:16px;width:100px;height:100px;background:#b45309dd}#D{right:126px;width:72px;height:72px;background:#047857dd;font-size:12px}
#screen{position:fixed;z-index:20;inset:0;background:#020617ee;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(460px,100%);background:#111827;padding:25px;border-radius:25px;text-align:center;border:1px solid #ffffff33}.card button{width:100%;padding:17px;border:0;border-radius:15px;background:#fbbf24;font-size:20px;font-weight:950}.card p{line-height:1.45;color:#dbeafe}
</style></head><body>
<canvas id="c"></canvas><div id="hud"><span id="level"></span><span id="stat"></span></div>
<button class="btn" id="L">◀</button><button class="btn" id="R">▶</button><button class="btn" id="V">SCHAU<br>👀</button><button class="btn" id="D">RÖHRE<br>▼</button><button class="btn" id="J">SPRING</button>
<div id="screen"><div class="card"><h1>🥷 Ninja Jump 4</h1><p>10 geprüfte Hindernis-Level mit machbaren Sprüngen, Abgründen, Stacheln, Bodenmonstern, Plattformen, unterirdischen Röhren und besiegbaren Bossen.</p><button id="go">SPIEL STARTEN</button><p>Springe auf Monster und Bosse. Halte SCHAU 👀 gedrückt und benutze ◀ ▶, um vorauszuschauen, ohne den Ninja zu bewegen.</p></div></div>
<script>
(()=>{"use strict";
document.addEventListener("contextmenu",e=>e.preventDefault(),{capture:true});
document.addEventListener("selectstart",e=>e.preventDefault(),{capture:true});
document.addEventListener("dragstart",e=>e.preventDefault(),{capture:true});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.target.closest?.(".btn"))e.preventDefault()},{passive:false});
const C=document.querySelector("#c"),G=C.getContext("2d"),S=document.querySelector("#screen"),LE=document.querySelector("#level"),ST=document.querySelector("#stat");
let W,H,D,run=0,last=0,lv=0,coins=0,lives=5,cam=0,underground=false,checkpoint=40,lookMode=false,lookCam=0;
const I={l:0,r:0,j:0,d:0,v:0}, names=["🌳 Wald","🏜️ Wüste","❄️ Eis","🌙 Nachtwald","🌋 Vulkan","☁️ Himmel","🍄 Höhlen","🏯 Tempel","🔥 Dämonentor","🏰 Schattenburg"];
const skies=["#60a5fa","#e9a84a","#b8e5f4","#172554","#7f1d1d","#60a5fa","#43385c","#9f6d4d","#431407","#334155"];
let P,platforms,monsters,items,spikes,pipes,goal,boss,pits;

function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;G.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();
function hud(){LE.textContent=names[lv]+" · "+(lv+1)+"/10";ST.textContent="🪙 "+coins+"　❤️ "+lives}
function addPlatform(x,y,w=150,m=0){platforms.push({x,y,w,h:22,m,base:x,v:m?1.15:0,range:70})}
function build(){
 let floor=H-86;underground=false;cam=0;checkpoint=40;
 P={x:40,y:floor-55,w:38,h:50,vx:0,vy:0,on:0,inv:0};
 platforms=[];monsters=[];items=[];spikes=[];pipes=[];pits=[];boss=null;
 // Floor is split into sections, creating real pits.
 let sections=[[0,520],[650,520],[1300,500],[1950,560],[2670,880]];
 sections.forEach(s=>platforms.push({x:s[0],y:floor,w:s[1],h:120}));
 pits=[[520,130],[1170,130],[1800,150],[2510,160]];
 // Required jumping route across gaps and over obstacles.
 let route=[
 [430,105,130],[555,150,125],[700,120,140],[1015,150,135],[1145,190,125],
 [1285,145,145],[1660,165,135],[1785,205,125],[1930,155,145],[2340,175,135],
 [2470,215,125],[2615,165,145],[3020,180,140],[3160,135,140]
 ];
 route.forEach((r,i)=>{addPlatform(r[0],floor-r[1]-(lv%2)*5,r[2],lv>=3&&i%4===2);if(i%2===0)items.push({x:r[0]+r[2]/2,y:floor-r[1]-30-(lv%2)*5,t:0})});
 // Ground monsters force jumping/combat.
 [280,800,1430,2100,2800].forEach((x,i)=>monsters.push({x,y:floor-36,w:36,h:36,v:i%2?1.05:-1.05,a:x-70,b:x+90,on:1,type:(i+lv)%3}));
 // Platform monsters.
 [2,5,8,11].forEach((idx,k)=>{let a=platforms[sections.length+idx];if(a)monsters.push({x:a.x+35,y:a.y-36,w:36,h:36,v:k%2?1:-1,a:a.x,b:a.x+a.w-36,on:1,type:(k+1)%3})});
 // Spikes on ground sections.
 [350,900,1510,2190,2880].slice(0,3+Math.floor(lv/3)).forEach(x=>spikes.push({x,y:floor-20,w:75,h:20}));
 // A real down-pipe with an underground room and exit pipe.
 pipes=[{x:1080,y:floor-74,w:66,h:74,kind:"down"},{x:2380,y:floor-74,w:66,h:74,kind:"down"}];
 goal={x:3400,y:floor-115,w:55,h:115};
 if(lv===2||lv===5||lv===9)boss={x:3180,y:floor-86,w:86,h:86,v:1.45,a:3070,b:3340,hp:lv===9?6:3,on:1};
 hud()
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function respawn(){if(P.inv)return;lives--;hud();if(lives<=0){end("💥 Game Over","NOCHMAL");return}P.x=checkpoint;P.y=H-180;P.vx=P.vy=0;P.inv=100;underground=false}
function end(title,button){run=0;S.style.display="flex";S.innerHTML='<div class="card"><h1>'+title+'</h1><p>Münzen: '+coins+'</p><button id="go">'+button+'</button></div>';document.querySelector("#go").onclick=start}
function start(){if(lives<=0||lv>=10){lv=0;coins=0;lives=5}S.style.display="none";build();run=1;last=performance.now();requestAnimationFrame(loop)}document.querySelector("#go").onclick=start;
function bind(id,k){
 let e=document.querySelector(id);
 const down=q=>{q.preventDefault();q.stopPropagation();I[k]=1;try{if(q.pointerId!=null)e.setPointerCapture(q.pointerId)}catch(_){}};
 const up=q=>{if(q){q.preventDefault();q.stopPropagation()}I[k]=0};
 e.addEventListener("pointerdown",down,{passive:false});
 e.addEventListener("pointerup",up,{passive:false});
 e.addEventListener("pointercancel",up,{passive:false});
 e.addEventListener("lostpointercapture",up,{passive:false});
 e.addEventListener("touchstart",q=>{q.preventDefault();I[k]=1},{passive:false});
 e.addEventListener("touchend",up,{passive:false});
 e.addEventListener("touchcancel",up,{passive:false});
}
bind("#L","l");bind("#R","r");bind("#J","j");bind("#D","d");bind("#V","v");
addEventListener("pointerup",()=>{I.l=0;I.r=0;I.v=0});
addEventListener("touchend",()=>{I.l=0;I.r=0;I.v=0},{passive:true});

function enterPipe(){
 if(underground){ // exit upward into later part of level
   underground=false;P.x=2460;P.y=H-240;P.vy=-6;checkpoint=2460;return;
 }
 for(const t of pipes)if(Math.abs(P.x+P.w/2-(t.x+t.w/2))<48&&P.y+P.h>=t.y-6){
   underground=true;P.x=150;P.y=H-210;P.vx=P.vy=0;return;
 }
}
function update(){
 if(I.v){
   if(!lookMode){lookMode=true;lookCam=cam;P.vx=0}
   if(I.l)lookCam-=8;if(I.r)lookCam+=8;
   let mc=Math.max(0,(underground?1250:3550)-W);
   lookCam=Math.max(0,Math.min(lookCam,mc));cam=lookCam;return;
 } else if(lookMode){lookMode=false;cam=Math.max(0,Math.min(P.x-W*.3,Math.max(0,(underground?1250:3550)-W)))}
 if(I.l)P.vx=Math.max(-5.8,P.vx-.72);if(I.r)P.vx=Math.min(5.8,P.vx+.72);if(!I.l&&!I.r)P.vx*=.78;
 if(I.j&&P.on){P.vy=-13.6;P.on=0}I.j=0;if(I.d){enterPipe();I.d=0}
 P.vy=Math.min(15,P.vy+.64);P.x=Math.max(0,P.x+P.vx);P.y+=P.vy;P.on=0;
 let active=underground?undergroundPlatforms():platforms;
 for(const a of active){if(a.m){a.x+=a.v;if(Math.abs(a.x-a.base)>a.range)a.v=-a.v}if(P.vy>=0&&P.x+P.w>a.x&&P.x<a.x+a.w&&P.y+P.h>=a.y&&P.y+P.h-P.vy<=a.y+8){P.y=a.y-P.h;P.vy=0;P.on=1;if(a.m)P.x+=a.v}}
 if(P.y>H+70){respawn();return}if(P.inv)P.inv--;
 if(!underground){
   for(const s of spikes)if(hit(P,s)&&!P.inv)respawn();
   for(const m of monsters)if(m.on){m.x+=m.v;if(m.x<m.a||m.x>m.b)m.v=-m.v;if(hit(P,m)&&!P.inv){if(P.vy>1&&P.y+P.h-m.y<27){m.on=0;P.vy=-9;coins+=2;hud()}else respawn()}}
   for(const o of items)if(!o.t){let dx=P.x+19-o.x,dy=P.y+25-o.y;if(dx*dx+dy*dy<950){o.t=1;coins++;hud()}}
   if(boss&&boss.on){boss.x+=boss.v;if(boss.x<boss.a||boss.x>boss.b)boss.v=-boss.v;if(hit(P,boss)&&!P.inv){if(P.vy>1&&P.y+P.h-boss.y<31){boss.hp--;P.vy=-11;P.inv=32;if(!boss.hp){boss.on=0;coins+=15;hud()}}else respawn()}}
   if(P.x>1900&&checkpoint<1900)checkpoint=1950;
   if(hit(P,goal)&&(!boss||!boss.on)){if(lv<9){lv++;build()}else{lv=10;end("🏆 NINJA-MEISTER!","NOCHMAL");return}}
   cam=Math.max(0,Math.min(P.x-W*.3,3550-W));
 }else cam=Math.max(0,Math.min(P.x-W*.3,1250-W));
}
function undergroundPlatforms(){let y=H-80;return[{x:0,y,w:1300,h:100},{x:170,y:y-95,w:145,h:22},{x:330,y:y-145,w:145,h:22},{x:490,y:y-105,w:145,h:22},{x:650,y:y-165,w:145,h:22},{x:810,y:y-115,w:145,h:22},{x:970,y:y-155,w:180,h:22}]}
function ninja(){G.save();if(P.inv&&Math.floor(P.inv/5)%2)G.globalAlpha=.3;G.fillStyle="#0f172a";G.fillRect(P.x+4,P.y+2,30,48);G.fillStyle="#d6a57b";G.fillRect(P.x+9,P.y+12,20,8);G.fillStyle="#fff";G.fillRect(P.x+11,P.y+14,5,3);G.fillRect(P.x+24,P.y+14,5,3);G.fillStyle="#dc2626";G.fillRect(P.x+4,P.y+29,30,5);G.restore()}
function draw(){
 G.fillStyle=underground?"#17121f":skies[lv];G.fillRect(0,0,W,H);G.save();G.translate(-cam,0);
 let active=underground?undergroundPlatforms():platforms;
 for(const a of active){G.fillStyle=underground?"#51435c":"#35654a";G.fillRect(a.x,a.y,a.w,a.h);G.fillStyle="#ffffff30";G.fillRect(a.x,a.y,a.w,6)}
 if(underground){
   G.fillStyle="#22c55e";G.fillRect(1120,H-154,70,74);G.fillRect(1113,H-154,84,18);
   for(let i=0;i<8;i++){G.fillStyle="#facc15";G.beginPath();G.arc(230+i*110,H-300-(i%2)*60,9,0,7);G.fill()}
   G.fillStyle="#fff";G.font="bold 18px sans-serif";G.fillText("Geheimtunnel → bis zur grünen Ausgangsröhre",90,70);
 }else{
   for(const t of pipes){G.fillStyle="#15803d";G.fillRect(t.x,t.y,t.w,t.h);G.fillStyle="#22c55e";G.fillRect(t.x-7,t.y,t.w+14,18)}
   for(const s of spikes){G.fillStyle="#d1d5db";for(let z=0;z<s.w;z+=15){G.beginPath();G.moveTo(s.x+z,s.y+s.h);G.lineTo(s.x+z+7.5,s.y);G.lineTo(s.x+z+15,s.y+s.h);G.fill()}}
   for(const o of items)if(!o.t){G.fillStyle="#facc15";G.beginPath();G.arc(o.x,o.y,10,0,7);G.fill()}
   for(const m of monsters)if(m.on){G.font="31px sans-serif";G.fillText(["👾","🦇","👹"][m.type],m.x,m.y+31)}
   if(boss&&boss.on){G.font="55px sans-serif";G.fillText("👹",boss.x+10,boss.y+62);G.fillStyle="#fff";G.font="bold 14px sans-serif";G.fillText("BOSS ❤️ "+boss.hp,boss.x,boss.y-8)}
   G.fillStyle="#eee";G.fillRect(goal.x,goal.y,7,goal.h);G.fillStyle="#fbbf24";G.fillRect(goal.x+7,goal.y,48,38);
 }
 ninja();G.restore()
}
function loop(t){if(!run)return;let n=Math.min(3,Math.max(1,Math.round((t-last)/16.7)));last=t;while(n--)update();if(run){draw();requestAnimationFrame(loop)}}build();draw();
})();
</script></body></html>
