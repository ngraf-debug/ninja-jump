const C=document.querySelector("#c"),G=C.getContext("2d"),S=document.querySelector("#screen"),LE=document.querySelector("#level"),ST=document.querySelector("#stat"),IGS=document.querySelector("#ingameShop"),IGM=document.querySelector("#ingameMenu");
let W,H,D,run=0,last=0,lv=0,coins=0,coinsCollected=0,lives=5,cam=0,underground=false,checkpoint=40,lookMode=false,lookCam=0,facing=1,startTime=0,bossKills=0,shield=0,floatPower=0,jumpPower=0,helpers=[],enemyHelpers=[],shopFromGame=false,currentGameStarted=false;
const TOTAL=20;
const I={l:0,r:0,j:0,d:0,v:0}, names=["🌳 Wald","🏜️ Wüste","❄️ Eis","🌙 Nachtwald","🌋 Vulkan","☁️ Himmel","🍄 Höhlen","🏯 Tempel","🔥 Dämonentor","🏰 Schattenburg","🌧️ Sturmwald","🦂 Canyon","🧊 Gletscher","🌌 Sternennacht","🌋 Lavahöhle","🌪️ Wolkensturm","💎 Kristallhöhle","⛩️ Ninja-Tempel","👺 Dämonenpfad","👑 Kaiserburg"];

function loadProfile(){try{let q=JSON.parse(localStorage.ninjaJumpProfile||"null");if(q)profile={...profile,...q,dur:{...profile.dur,...(q.dur||{})}};if(!localStorage.ninjaJumpStart222V1){profile.bank=222;localStorage.ninjaJumpStart222V1="1";localStorage.ninjaJumpProfile=JSON.stringify(profile)}}catch(_){}}

loadProfile();
function suit(){return suits.find(x=>x.id===profile.suit)||suits[0]}
for(const a of suits)if((profile.dur[a.id]??a.max)>a.max)profile.dur[a.id]=a.max;saveProfile();
function repairCost(a,d){return Math.max(0,Math.ceil((a.max-d)*a.repair))}

function snapshot(name){return {name:name||"Spielstand",savedAt:Date.now(),elapsed:Math.max(0,performance.now()-startTime),lv,coins,coinsCollected,lives,cam,underground,checkpoint,facing,bossKills,shield,floatPower,jumpPower,profile:JSON.parse(JSON.stringify(profile)),P,platforms,monsters,items,spikes,pipes,goal,boss,pits,tunnelCoins,tunnelMonsters,tunnelObstacles,boostPads,fallingPlatforms,helpers,enemyHelpers,pipeTarget}}

function restoreGame(g){profile={...g.profile,dur:{...(g.profile?.dur||{})}};saveProfile();lv=g.lv||0;coins=g.coins||0;coinsCollected=g.coinsCollected??g.coins??0;lives=g.lives||5;cam=g.cam||0;underground=!!g.underground;checkpoint=g.checkpoint||40;facing=g.facing||1;bossKills=g.bossKills||0;shield=g.shield||0;floatPower=g.floatPower||0;jumpPower=g.jumpPower||0;P=g.P;platforms=g.platforms||[];monsters=g.monsters||[];items=g.items||[];spikes=g.spikes||[];pipes=g.pipes||[];goal=g.goal;boss=g.boss;pits=g.pits||[];tunnelCoins=g.tunnelCoins||[];tunnelMonsters=g.tunnelMonsters||[];tunnelObstacles=g.tunnelObstacles||[];boostPads=g.boostPads||[];fallingPlatforms=g.fallingPlatforms||[];helpers=g.helpers||[];enemyHelpers=g.enemyHelpers||[];pipeTarget=g.pipeTarget||null;startTime=performance.now()-(g.elapsed||0);currentGameStarted=true;S.style.display="none";IGS.style.display="block";IGM.style.display="block";hud();run=1;last=performance.now();requestAnimationFrame(loop)}
function showSavedGames(){run=0;IGS.style.display="none";IGM.style.display="none";let a=getSaves();S.style.display="flex";S.innerHTML='<div class="card"><h1>💾 GESPEICHERTE SPIELE</h1><div id="saveList"></div><button id="back" class="small">⬅️ HAUPTMENÜ</button></div>';let w=document.querySelector("#saveList");if(!a.length)w.innerHTML='<p>Noch keine gespeicherten Spiele.</p>';a.forEach((g,i)=>{let d=document.createElement("div");d.className="shopItem";d.innerHTML='<b>'+String(g.name).replace(/[<>]/g,"")+'</b><br>Level '+((g.lv||0)+1)+'/'+TOTAL+' · 🪙 '+(g.coins||0)+'<br><button class="small load">▶️ LADEN</button><button class="small del">🗑️ LÖSCHEN</button>';d.querySelector(".load").onclick=()=>restoreGame(g);d.querySelector(".del").onclick=()=>{let q=getSaves();q.splice(i,1);putSaves(q);showSavedGames()};w.appendChild(d)});document.querySelector("#back").onclick=showMenu}
function beginFreshGame(){profile={bank:222,owned:["cloth"],suit:"cloth",dur:{cloth:3},pets:[]};saveProfile();lv=0;coins=0;coinsCollected=0;lives=5;bossKills=0;shield=0;floatPower=0;jumpPower=0;startTime=performance.now();currentGameStarted=true;S.style.display="none";build();IGS.style.display="block";IGM.style.display="block";run=1;last=performance.now();requestAnimationFrame(loop)}
function requestNewGame(){run=0;IGS.style.display="none";IGM.style.display="none";S.style.display="flex";if(!currentGameStarted){beginFreshGame();return}S.innerHTML='<div class="card"><h1>🆕 NEUES SPIEL</h1><p>Möchtest du dein bisheriges Spiel vorher speichern?</p><div class="menuBtns"><button id="yes">💾 SPEICHERN</button><button id="no">OHNE SPEICHERN NEU STARTEN</button><button id="cancel" class="small">⬅️ ABBRECHEN</button></div></div>';document.querySelector("#yes").onclick=()=>{S.innerHTML='<div class="card"><h1>💾 SPIEL BENENNEN</h1><p>Gib deinem Spiel einen Namen:</p><input id="saveName" maxlength="30" placeholder="z. B. Mein Wald-Spiel" style="width:100%;padding:14px;border-radius:12px;font-size:18px;margin-bottom:12px"><button id="saveGo">SPEICHERN & NEUES SPIEL</button></div>';let inp=document.querySelector("#saveName");inp.focus();document.querySelector("#saveGo").onclick=()=>{saveNamedGame(inp.value.trim()||("Spiel "+(getSaves().length+1)));beginFreshGame()}};document.querySelector("#no").onclick=beginFreshGame;document.querySelector("#cancel").onclick=showMenu}
function showInGameMenu(){
 if(!currentGameStarted)return;
 run=0;shopFromGame=false;IGS.style.display="none";IGM.style.display="none";S.style.display="flex";
 S.innerHTML='<div class="card"><h1>☰ SPIELMENÜ</h1><div class="menuBtns"><button id="resume">▶️ WEITERSPIELEN</button><button id="saveNow">💾 SPIEL SPEICHERN</button><button id="newNow">🆕 NEUES SPIEL</button><button id="homeNow">🏠 HAUPTMENÜ</button></div></div>';
 document.querySelector("#resume").onclick=()=>{S.style.display="none";IGS.style.display="block";IGM.style.display="block";run=1;last=performance.now();requestAnimationFrame(loop)};
 document.querySelector("#saveNow").onclick=()=>{
  S.innerHTML='<div class="card"><h1>💾 SPIEL SPEICHERN</h1><p>Wie soll dieser Spielstand heißen?</p><input id="saveName" maxlength="30" placeholder="z. B. Level 8" style="width:100%;padding:14px;border-radius:12px;font-size:18px;margin-bottom:12px"><button id="saveGo">SPEICHERN</button><button id="saveCancel" class="small">⬅️ ZURÜCK</button></div>';
  let inp=document.querySelector("#saveName");inp.focus();
  document.querySelector("#saveGo").onclick=()=>{saveNamedGame(inp.value.trim()||("Spiel "+(getSaves().length+1)));showInGameMenu()};
  document.querySelector("#saveCancel").onclick=showInGameMenu;
 };
 document.querySelector("#newNow").onclick=requestNewGame;
 document.querySelector("#homeNow").onclick=showMenu;
}
function showMenu(){run=0;shopFromGame=false;IGS.style.display="none";IGM.style.display="none";S.style.display="flex";S.innerHTML='<div class="card"><h1>🥷 NINJA JUMP</h1><p>🪙 Shop-Münzen: '+profile.bank+'</p><div class="menuBtns"><button id="play">🆕 NEUES SPIEL</button><button id="saves">💾 GESPEICHERTE SPIELE</button><button id="shop">🛒 SHOP</button><button id="recs">🏆 REKORDE</button></div><p>💙 deine Helfer · ❤️ normale Gegner · 🖤 besondere böse Helfer</p></div>';document.querySelector("#play").onclick=requestNewGame;document.querySelector("#saves").onclick=showSavedGames;document.querySelector("#shop").onclick=showShop;document.querySelector("#recs").onclick=showRecords}
function showRecords(){let r=records(0);S.innerHTML='<div class="card"><h1>🏆 REKORDE</h1><p>Beste Zeit: '+(r.time?Math.floor(r.time/60)+'m '+(r.time%60)+'s':'—')+'<br>🪙 Münzrekord: '+r.coins+'<br>🏁 Höchstes Level: '+r.levels+'/'+TOTAL+'</p><button id="back">⬅️ HAUPTMENÜ</button></div>';document.querySelector("#back").onclick=showMenu}
function syncHelpers(){for(const h of helpers){let q=pets.find(p=>p.id===h.id);if(q){h.maxHp=Math.max(h.maxHp||0,q.hp);h.hp=Math.max(h.hp||0,Math.min(h.maxHp,q.hp));h.power=q.power;h.armor=suit().protect}}}
function availableShopCoins(){return profile.bank+(shopFromGame?coins:0)}
function spendShopCoins(n){if(availableShopCoins()<n)return false;if(shopFromGame){let fromRun=Math.min(coins,n);coins-=fromRun;n-=fromRun}if(n>0)profile.bank-=n;saveProfile();hud();return true}
function showShop(inGame=false){
 if(inGame){shopFromGame=true;run=0}
 let a=suit(),d=Math.min(a.max,profile.dur[a.id]??a.max),rc=repairCost(a,d);
 S.style.display="flex";IGS.style.display="none";IGM.style.display="none";
 S.innerHTML='<div class="card"><h1>🛒 SHOP</h1><p>🪙 '+availableShopCoins()+(shopFromGame?' verfügbar (davon '+coins+' im aktuellen Spiel)':'')+'<br>Aktiv: <b>'+a.name+'</b><br>🛡️ Zustand: '+d+'/'+a.max+'</p><div id="wares"></div><button id="repair" class="small">🔧 Reparieren ('+rc+' 🪙)</button><div id="pets"><p><b>🐾 TIER-HELFER</b></p></div><button id="back" class="small">⬅️ '+(shopFromGame?'ZURÜCK ZUM SPIEL':'HAUPTMENÜ')+'</button></div>';
 let w=document.querySelector("#wares");
 suits.forEach(x=>{let own=profile.owned.includes(x.id),dd=Math.min(x.max,profile.dur[x.id]??x.max);let b=document.createElement("button");b.className="small shopItem";b.innerHTML='<b>'+x.name+'</b>💰 Preis: '+x.price+' Münzen<br>Schutz '+x.protect+' · Haltbarkeit '+dd+'/'+x.max+(own?' · '+(profile.suit===x.id?'AKTIV':'ANZIEHEN'):' · KAUFEN');b.onclick=()=>{if(own){profile.suit=x.id}else if(spendShopCoins(x.price)){profile.owned.push(x.id);profile.dur[x.id]=x.max;profile.suit=x.id}saveProfile();syncHelpers();showShop(false)};w.appendChild(b)});
 let pw=document.querySelector("#pets");
 pets.forEach(x=>{let own=profile.pets.includes(x.id),b=document.createElement("button");b.className="small shopItem";b.innerHTML="<b>"+x.name+"</b>💰 Preis: "+x.price+" Münzen<br>❤️ "+x.hp+" · Stärke "+x.power+(own?" · GEKAUFT":" · KAUFEN");b.disabled=own;b.onclick=()=>{if(!own&&spendShopCoins(x.price)){profile.pets.push(x.id);saveProfile();if(shopFromGame){let q=x;helpers.push({id:q.id,x:P.x-55-helpers.length*28,y:P.y,emoji:q.name.slice(0,2),cool:0,hurtCool:0,hp:q.hp,maxHp:q.hp,power:q.power,armor:suit().protect,on:1})}showShop(false)}};pw.appendChild(b)});
 document.querySelector("#repair").disabled=rc===0;document.querySelector("#repair").onclick=()=>{let x=suit(),dd=Math.min(x.max,profile.dur[x.id]??x.max),cost=repairCost(x,dd);if(cost&&profile.bank>=cost){profile.bank-=cost;profile.dur[x.id]=x.max;saveProfile();syncHelpers();showShop(false)}};
 document.querySelector("#back").onclick=()=>{if(shopFromGame){shopFromGame=false;S.style.display="none";IGS.style.display="block";IGM.style.display="block";run=1;last=performance.now();requestAnimationFrame(loop)}else showMenu()};
}
function armorHit(dmg){let a=suit(),d=profile.dur[a.id]??a.max;if(d>0){d=Math.max(0,d-Math.max(1,dmg-a.protect+1));profile.dur[a.id]=d;saveProfile();P.inv=55;hud();return true}return false}
function hurt(dmg=1){if(P.inv)return;if(shield){shield=0;P.inv=80;hud();return}if(armorHit(dmg))return;for(let i=0;i<dmg;i++){lives--;if(lives<=0)break}hud();if(lives<=0){end("💥 Game Over","NOCHMAL");return}P.x=checkpoint;P.y=H-180;P.vx=P.vy=0;P.inv=100;underground=false}


function resize(){W=innerWidth;H=Math.max(300,innerHeight-116);D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;G.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();
function hud(){let a=suit(),d=profile.dur[a.id]??a.max;LE.textContent=names[lv]+" · "+(lv+1)+"/"+TOTAL;ST.textContent="🪙 "+coins+"　❤️ "+lives+"　🛡️ "+d+"　⚡"+(1+Math.floor(lv/4))}
function addPlatform(x,y,w=150,m=0){
 // Spätere Level: bewegliche Plattformen werden etwas schneller, bleiben aber erreichbar.
 let speed=m?(1.05+Math.min(lv,19)*.035):0;
 platforms.push({x,y,w,h:22,m,base:x,baseY:y,v:speed,range:(lv>=14?105:lv>=8?85:70),axis:(m&&lv>=7&&platforms.length%3===0)?"y":"x"})
}
function build(){
 let floor=H-20;underground=false;cam=0;checkpoint=40;
 P={x:40,y:floor-55,w:38,h:50,vx:0,vy:0,on:0,inv:0};
 platforms=[];monsters=[];items=[];spikes=[];pipes=[];pits=[];tunnelCoins=[];tunnelMonsters=[];tunnelObstacles=[];boostPads=[];fallingPlatforms=[];helpers=[];enemyHelpers=[];boss=null;pipeTarget=null;
 // Floor is split into sections, creating real pits.
 let sections=[[0,520],[650,520],[1300,500],[1950,560],[2670,880]];
 sections.forEach(s=>platforms.push({x:s[0],y:floor,w:s[1],h:120}));
 pits=[[520,130],[1170,130],[1800,150],[2510,160]];
 // Required jumping route across gaps and over obstacles.
 let route=[
 [430,110,145],[555,195,140],[690,280,145],[825,365,150],
 [1030,285,150],[1160,375,145],[1295,465,155],[1450,375,150],
 [1650,285,150],[1780,375,145],[1920,465,155],[2080,370,150],
 [2310,285,150],[2445,375,145],[2590,465,155],[2760,370,150],
 [3000,285,155],[3160,375,155]
 ];
 // Hohe Plattformen bleiben hoch; jeder notwendige Höhenunterschied ist trotzdem springbar.
 route.forEach((r,i)=>{
 // Schwierigkeit steigt stufenweise: ab Level 4 wenige, später mehr bewegliche Plattformen.
 let moving=lv>=2 && (i%(lv>=15?2:lv>=9?3:lv>=5?4:5)===3%(lv>=15?2:lv>=9?3:lv>=5?4:5));
 addPlatform(r[0],floor-r[1],r[2],moving);
 if(i%2===0)items.push({x:r[0]+r[2]/2,y:floor-r[1]-30,t:0})
});
 // Ground monsters force jumping/combat.
 [180,420,800,1030,1430,1690,2100,2350,2800,3060].forEach((x,i)=>{
 let ms=1.0+Math.min(lv,19)*.025;
 monsters.push({x,y:floor-36,w:36,h:36,v:i%2?ms:-ms,a:x-70,b:x+90,on:1,type:(i+lv)%3})
});
 // Ab höheren Leveln kommen zusätzliche Gegner dazu, ohne die Sprungroute zu verändern.
 if(lv>=6)[1180,2530].forEach((x,i)=>monsters.push({x,y:floor-36,w:36,h:36,v:i?1.2:-1.2,a:x-55,b:x+75,on:1,type:(lv+i)%3}));
 if(lv>=13)[1880,3270].forEach((x,i)=>monsters.push({x,y:floor-36,w:36,h:36,v:i?1.35:-1.35,a:x-50,b:x+70,on:1,type:(lv+i+1)%3}));
 monsters.forEach((m,i)=>{m.damage=1+Math.min(3,Math.floor((lv+(i%4)*2)/7));m.hp=1+((i+lv)%3)+Math.min(2,Math.floor(lv/8));m.maxHp=m.hp});
 // Platform monsters.
 [2,5,8,11].forEach((idx,k)=>{let a=platforms[sections.length+idx];if(a)monsters.push({x:a.x+35,y:a.y-36,w:36,h:36,v:k%2?1:-1,a:a.x,b:a.x+a.w-36,on:1,type:(k+1)%3})});
 monsters.forEach(m=>{if(m.hp==null){m.damage=1+Math.floor(lv/9);m.hp=1+Math.floor(lv/7);m.maxHp=m.hp}});
 // Spikes on ground sections.
 [330,470,880,1010,1490,1660,2170,2320,2860,3040].slice(0,Math.max(0,Math.min(10,5+Math.floor(lv/3))-2)).forEach(x=>spikes.push({x,y:floor-20,w:75,h:20}));
 // A real down-pipe with an underground room and exit pipe.

function levelChest(){run=0;IGS.style.display="none";IGM.style.display="none";let finished=lv+1;records(0);S.style.display="flex";S.innerHTML='<div class="card"><h1>🎉 LEVEL '+finished+' GESCHAFFT!</h1><p>Herzlichen Glückwunsch! 🥷<br>Tippe auf die Schatztruhe für eine kleine Superkraft.</p><button id="chest" style="font-size:52px">🎁</button></div>';document.querySelector("#chest").onclick=()=>{let powers=[()=>{lives+=1;for(const h of helpers){h.maxHp++;h.hp++}return"❤️ +1 Leben (auch für Helfer)"},()=>{lives+=2;for(const h of helpers){h.maxHp+=2;h.hp+=2}return"❤️❤️ +2 Leben (auch für Helfer)"},()=>{lives+=3;for(const h of helpers){h.maxHp+=3;h.hp+=3}return"❤️❤️❤️ +3 Leben (auch für Helfer)"},()=>{coins+=5;coinsCollected+=5;return"🪙 +5 Münzen"},()=>{shield=1;return"🛡️ Einmaliger Schutzschild"},()=>{floatPower=360;return"🪽 Kurz schweben"},()=>{jumpPower=600;return"⚡ Kurz höher springen"}];let msg=powers[Math.floor(Math.random()*powers.length)]();hud();S.innerHTML='<div class="card"><h1>✨ '+msg+'</h1><p>Deine Belohnung aus der Schatztruhe!</p><button id="next">'+(finished<TOTAL?'WEITER ZU LEVEL '+(finished+1):'ERGEBNIS ANZEIGEN')+'</button></div>';document.querySelector("#next").onclick=()=>{if(finished<TOTAL){lv++;S.style.display="none";build();IGS.style.display="block";IGM.style.display="block";run=1;last=performance.now();requestAnimationFrame(loop)}else{lv=TOTAL;end("🏆 NINJA-MEISTER!","NOCHMAL")}}}}
function bind(id,k){
 const e=document.querySelector(id);
 const down=q=>{q.preventDefault();q.stopPropagation();I[k]=1;try{e.setPointerCapture(q.pointerId)}catch(_){}};
 const up=q=>{q.preventDefault();q.stopPropagation();I[k]=0};
 e.addEventListener("pointerdown",down,{passive:false});
 e.addEventListener("pointerup",up,{passive:false});
 e.addEventListener("pointercancel",up,{passive:false});
 e.addEventListener("lostpointercapture",()=>I[k]=0,{passive:false});
}
bind("#L","l");bind("#R","r");bind("#J","j");bind("#D","d");bind("#V","v");
function keyControl(e){let code=e.code||e.key;let key=e.key;return ({ArrowLeft:"l",ArrowRight:"r",ArrowUp:"j",Space:"j"," ":"j",Enter:"d"})[code]||({ArrowLeft:"l",ArrowRight:"r",ArrowUp:"j"," ":"j",Enter:"d"})[key]}
addEventListener("keydown",e=>{let k=keyControl(e);if(!k)return;e.preventDefault();if(k==="j"){if(!e.repeat)I.j=1}else if(k==="d"){if(!e.repeat)I.d=1}else I[k]=1},{passive:false});
addEventListener("keyup",e=>{let k=keyControl(e);if(!k)return;e.preventDefault();if(k==="l"||k==="r")I[k]=0},{passive:false});
addEventListener("blur",()=>{I.l=I.r=I.j=I.d=0});

function enterPipe(){
 if(underground){
   // Nur an der grünen Ausgangsröhre kann man wieder hinaus.
   if(P.x+P.w>1680 && P.x<1795 && P.y+P.h>H-175){
     underground=false;P.x=pipeTarget?.returnX||2060;P.y=H-240;P.vy=-6;checkpoint=P.x;pipeTarget=null;
   }
   return;
 }
 for(const t of pipes){
   if(Math.abs(P.x+P.w/2-(t.x+t.w/2))<48&&P.y+P.h>=t.y-8){
     pipeTarget=t;underground=true;P.x=70;P.y=H-210;P.vx=P.vy=0;return;
   }
 }
}

function update(){
 if(I.v){
   if(!lookMode){lookMode=true;lookCam=cam;P.vx=0}
   if(I.l)lookCam-=10;if(I.r)lookCam+=10;
   let mc=Math.max(0,(underground?1850:3550)-W);
   lookCam=Math.max(0,Math.min(lookCam,mc));cam=lookCam;
   // Im SCHAU-Modus steuern die Pfeile ausschließlich die Kamera.
   return;
 } else if(lookMode){lookMode=false;I.l=0;I.r=0;cam=Math.max(0,Math.min(P.x-W*.3,Math.max(0,(underground?1850:3550)-W)))}
 if(I.l){P.vx=Math.max(-5.8,P.vx-.72);facing=-1}if(I.r){P.vx=Math.min(5.8,P.vx+.72);facing=1}if(!I.l&&!I.r)P.vx*=.78;
 if(I.j&&P.on){P.vy=jumpPower?-15.2:-13.6;P.on=0}I.j=0;if(I.d){enterPipe();I.d=0}
 P.vy=Math.min(15,P.vy+(floatPower?.34:.64));if(floatPower>0)floatPower--;if(jumpPower>0)jumpPower--;P.x=Math.max(0,P.x+P.vx);P.y+=P.vy;P.on=0;
 let active=underground?undergroundPlatforms():platforms;
 if(!underground&&fallingPlatforms.length){for(const a of fallingPlatforms){a.y+=a.v;if(Math.abs(a.y-a.baseY)>a.range)a.v=-a.v}active=active.concat(fallingPlatforms)}
 for(const a of active){if(a.m){if(a.axis==="y"){a.y+=a.v;if(Math.abs(a.y-a.baseY)>45)a.v=-a.v}else{a.x+=a.v;if(Math.abs(a.x-a.base)>a.range)a.v=-a.v}}if(P.vy>=0&&P.x+P.w>a.x&&P.x<a.x+a.w&&P.y+P.h>=a.y&&P.y+P.h-P.vy<=a.y+8){P.y=a.y-P.h;P.vy=0;P.on=1;if(a.m&&a.axis!=="y")P.x+=a.v}}
 if(!underground)for(const b of boostPads){if(P.vy>=0&&P.x+P.w>b.x&&P.x<b.x+b.w&&P.y+P.h>=b.y&&P.y+P.h-P.vy<=b.y+12){P.y=b.y-P.h;P.vy=-17.2;P.on=0}}
 if(P.y>H+70){respawn();return}if(P.inv)P.inv--;
 if(!underground){
   for(const s of spikes)if(hit(P,s)&&!P.inv)respawn();
   for(const m of monsters)if(m.on){m.x+=m.v;if(m.x<m.a||m.x>m.b)m.v=-m.v;if(hit(P,m)&&!P.inv){if(P.vy>1&&P.y+P.h-m.y<27){m.hp=(m.hp||1)-1;if(m.hp<=0){m.on=0;coins+=2;coinsCollected+=2}P.vy=-9;hud()}else hurt(m.damage||1)}}
   for(const o of items)if(!o.t){let dx=P.x+19-o.x,dy=P.y+25-o.y;if(dx*dx+dy*dy<950){o.t=1;coins++;coinsCollected++;hud()}}
   for(const e of enemyHelpers)if(e.on){e.x+=e.v;if(e.x<e.a||e.x>e.b)e.v=-e.v;if(hit(P,e)&&!P.inv){let armored=(profile.dur[suit().id]??suit().max)>0;if(armored&&P.vy>1&&P.y+P.h-e.y<28){e.hp--;P.vy=-9;P.inv=28;if(e.hp<=0){e.on=0;coins+=3;coinsCollected+=3;hud()}}else hurt(e.damage)}}
   for(const h of helpers){if(!h.on)continue;let hi=helpers.indexOf(h);let followX=P.x+facing*(P.w+28+hi*26);h.x+=(followX-h.x)*.16;h.y+=(P.y+10-h.y)*.12;if(h.cool>0)h.cool--;if(h.hurtCool>0)h.hurtCool--;let inFront=t=>{if(!t.on)return false;let playerDx=(t.x+t.w/2)-(P.x+P.w/2);let helperDx=(t.x+t.w/2)-(h.x+14);return facing*playerDx>20&&facing*playerDx<=125&&facing*helperDx>0&&Math.abs(helperDx)<=70&&Math.abs(t.y-h.y)<55};let e=enemyHelpers.find(inFront),m=monsters.find(inFront),target=e||m;if(target&&!h.cool){target.hp=(target.hp||1)-h.power;if(target.hp<=0){target.on=0;coins+=1;coinsCollected+=1;hud()}h.cool=78}if(target&&!h.hurtCool&&Math.abs(target.x-h.x)<25&&Math.abs(target.y-h.y)<38){let dmg=Math.max(1,(target.damage||1)-(h.armor||0));h.hp-=dmg;h.hurtCool=90;if(h.hp<=0){h.hp=0;h.on=0}}}
   if(boss&&boss.on){boss.x+=boss.v;if(boss.x<boss.a||boss.x>boss.b)boss.v=-boss.v;if(hit(P,boss)&&!P.inv){if(P.vy>1&&P.y+P.h-boss.y<31){boss.hp--;P.vy=-11;P.inv=32;if(!boss.hp){boss.on=0;coins+=15;coinsCollected+=15;lives++;for(const h of helpers){h.maxHp++;h.hp=Math.min(h.maxHp,h.hp+1)}bossKills++;hud()}}else hurt(3+Math.floor(lv/10))}}
   if(P.x>1900&&checkpoint<1900)checkpoint=1950;
   if(hit(P,goal)&&(!boss||!boss.on)){levelChest();return}
   cam=Math.max(0,Math.min(P.x-W*.3,3550-W));
 }else{
   for(const o of tunnelCoins)if(!o.t){let dx=P.x+19-o.x,dy=P.y+25-o.y;if(dx*dx+dy*dy<1500){o.t=1;coins++;coinsCollected++;hud()}}
   for(const m of tunnelMonsters)if(m.on){m.x+=m.v;if(m.x<m.a||m.x>m.b)m.v=-m.v;if(hit(P,m)&&!P.inv){if(P.vy>1&&P.y+P.h-m.y<28){m.on=0;P.vy=-9;coins+=2;coinsCollected+=2;hud()}else hurt(1+Math.floor(lv/9))}}
   for(const b of tunnelObstacles)if(hit(P,b)&&!P.inv)respawn();
   cam=Math.max(0,Math.min(P.x-W*.3,1850-W));
 }
}
function undergroundPlatforms(){let y=H-80;return[{x:0,y,w:1850,h:100},{x:250,y:y-75,w:145,h:22},{x:720,y:y-105,w:160,h:22},{x:1190,y:y-80,w:160,h:22},{x:1450,y:y-120,w:150,h:22}]}
function ninja(){G.save();if(P.inv&&Math.floor(P.inv/5)%2)G.globalAlpha=.3;G.fillStyle="#0f172a";G.fillRect(P.x+4,P.y+2,30,48);G.fillStyle="#d6a57b";G.fillRect(P.x+9,P.y+12,20,8);G.fillStyle="#fff";G.fillRect(P.x+11,P.y+14,5,3);G.fillRect(P.x+24,P.y+14,5,3);G.fillStyle="#dc2626";G.fillRect(P.x+4,P.y+29,30,5);let a=suit();if(a.id!=="cloth"){G.strokeStyle=a.id==="shadow"?"#a78bfa":a.id==="iron"?"#d1d5db":"#a16207";G.lineWidth=4;G.strokeRect(P.x+3,P.y+1,32,48)}G.restore()}

function draw(){
 G.fillStyle=underground?"#17121f":skies[lv];G.fillRect(0,0,W,H);G.save();G.translate(-cam,0);
 let active=underground?undergroundPlatforms():platforms.concat(fallingPlatforms);
 for(const a of active){G.fillStyle=underground?"#51435c":"#35654a";G.fillRect(a.x,a.y,a.w,a.h);G.fillStyle="#ffffff30";G.fillRect(a.x,a.y,a.w,6)}
 if(underground){
   // Ausgangsröhre steht ganz hinten im Tunnel.
   G.fillStyle="#22c55e";G.fillRect(1710,H-154,70,74);G.fillRect(1703,H-154,84,18);
   for(const o of tunnelCoins)if(!o.t){G.fillStyle="#facc15";G.beginPath();G.arc(o.x,o.y,11,0,7);G.fill()}
   // Eigene Tunnelmonster: Schleime statt der Oberwelt-Gegner.
   for(const m of tunnelMonsters)if(m.on){G.fillStyle="#a855f7";G.beginPath();G.arc(m.x+19,m.y+19,18,Math.PI,0);G.lineTo(m.x+37,m.y+34);G.lineTo(m.x+1,m.y+34);G.closePath();G.fill();G.fillStyle="#fff";G.fillRect(m.x+10,m.y+18,5,5);G.fillRect(m.x+24,m.y+18,5,5)}
   // Kristall-Hindernisse, aber keine Abgründe.
   for(const b of tunnelObstacles){G.fillStyle="#ef4444";G.beginPath();G.moveTo(b.x,b.y+b.h);G.lineTo(b.x+b.w*.5,b.y);G.lineTo(b.x+b.w,b.y+b.h);G.fill()}
   G.fillStyle="#fff";G.font="bold 18px sans-serif";G.fillText("Geheimtunnel: Münzen • Schleime • Ausgang →",90,70);
 }else{
   for(const b of boostPads){G.fillStyle="#f59e0b";G.fillRect(b.x,b.y,b.w,b.h);G.fillStyle="#fde047";for(let q=4;q<b.w;q+=14)G.fillRect(b.x+q,b.y-5,7,5)}
   for(const t of pipes){G.fillStyle="#15803d";G.fillRect(t.x,t.y,t.w,t.h);G.fillStyle="#22c55e";G.fillRect(t.x-7,t.y,t.w+14,18)}

   for(const o of items)if(!o.t){G.fillStyle="#facc15";G.beginPath();G.arc(o.x,o.y,10,0,7);G.fill()}

   G.fillStyle="#eee";G.fillRect(goal.x,goal.y,7,goal.h);G.fillStyle="#fbbf24";G.fillRect(goal.x+7,goal.y,48,38);
